apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-log-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-reader-binding
subjects:
  - kind: ServiceAccount
    name: log-reader
roleRef:
  kind: Role
  name: pod-log-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: test-repo-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-repo-web
  template:
    metadata:
      labels:
        app: test-repo-web
    spec:
      serviceAccountName: log-reader
      initContainers:
        - name: fetch-logs
          image: bitnami/kubectl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for app pod to be ready..."
              kubectl wait --for=condition=ready pod -l app=test-repo-app --timeout=120s
              sleep 5
              kubectl logs -l app=test-repo-app --tail=-1 > /shared/index.html 2>&1
          volumeMounts:
            - name: html
              mountPath: /shared
      containers:
        - name: web
          image: atebaikina/githw-web:latest
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          emptyDir: {}
