apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: test-repo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-repo-app
  template:
    metadata:
      labels:
        app: test-repo-app
    spec:
      containers:
        - name: app
          image: atebaikina/githw-app:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              ctest --test-dir build --output-on-failure
              echo "--- Tests completed ---"
              sleep infinity
