apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web-service
  labels:
    {{- include "test-repo-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: test-repo-web
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 80
      protocol: TCP
