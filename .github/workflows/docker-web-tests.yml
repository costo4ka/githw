name: Docker Build, Test and Publish

on:
  push:
    branches: [ "master", "feature/docker-web-hub" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run tests via docker-compose
        run: docker compose up --build --exit-code-from app

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push app image
        run: |
          docker tag test-repo-app:latest ${{ secrets.DOCKERHUB_USERNAME }}/test-repo-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/test-repo-app:latest

      - name: Tag and push web image
        run: |
          docker tag test-repo-web:latest ${{ secrets.DOCKERHUB_USERNAME }}/test-repo-web:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/test-repo-web:latest
